<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
  <!-- 9:16 clip banner, filled by tools/cut_clips.py and rendered with
       rsvg-convert. Transparent except the two plates. The gameplay is
       overlaid underneath, scaled to 1080 wide and centred; banner_layout()
       in cut_clips.py puts the plates in the rows the gameplay leaves free
       (above it and below it) and fills the position and size slots here.
       Fonts are from the verified list in designing-cartridge-covers/fonts.md. -->
  <g display="{{DISPLAY}}">
    <rect x="60" y="{{TITLE_PLATE_Y}}" width="960" height="{{TITLE_PLATE_H}}" rx="28" fill="#000000" fill-opacity="0.55"/>
    <text x="540" y="{{TITLE_Y}}" text-anchor="middle" font-family="Arial Black, Helvetica Neue, Arial, sans-serif"
          font-weight="900" font-size="{{TITLE_SIZE}}" fill="#ffffff">{{TITLE}}</text>
    <rect x="120" y="{{CTA_PLATE_Y}}" width="840" height="{{CTA_PLATE_H}}" rx="28" fill="#000000" fill-opacity="0.55"/>
    <text x="540" y="{{CTA_1_Y}}" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif"
          font-weight="bold" font-size="{{CTA_1_SIZE}}" fill="#e8eef7">{{CTA_1}}</text>
    <text x="540" y="{{CTA_2_Y}}" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif"
          font-weight="bold" font-size="{{CTA_2_SIZE}}" fill="#ffd23f">{{CTA_2}}</text>
  </g>
</svg>
