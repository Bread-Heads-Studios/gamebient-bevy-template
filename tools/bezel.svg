<?xml version="1.0" encoding="UTF-8"?>
<!--
  PLACEHOLDER bezel for Gamebient Game. Rendered by tools/frame-art.sh via
  rsvg-convert to assets/bezel.png, 1920x1920. Cabinets draw it behind the
  game to fill the part of the panel the game does not use.

  Before shipping, redesign it from the game's cover: see frame-art.md in the
  `designing-cartridge-covers` skill. What binds every bezel:

  - The image is square, cover-fitted to the display and centre-cropped.
    A landscape display shows rows 420 to 1500. A portrait display shows
    columns 420 to 1500. The four 420x420 corners are never shown.
  - The game is drawn over the centre, so the central 1080x1080 (x and y
    from 420 to 1500) holds no detail: one flat colour. frame-art.sh fails
    the render if the luma range there is above 8.
  - Low contrast everywhere: darkest to brightest within 96 luma levels.
    frame-art.sh fails the render otherwise.
  - No lettering, logos or faces. Texture, pattern and large soft shapes,
    placed in the four arms and faded toward the centre.
  - Full brightness, mid-tones. The frame multiplies the bezel by 0.35 when
    idle and 0.20 during play, and its saturation by 0.6. Never draw it dim:
    a bezel drawn dark turns black on the cabinet.
  - A still image, and opaque: the background rect covers the whole canvas.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1920" viewBox="0 0 1920 1920">
  <defs>
    <pattern id="grid" width="120" height="120" patternUnits="userSpaceOnUse">
      <path d="M0 1H120M1 0V120" fill="none" stroke="#6f9fd8" stroke-width="2"/>
    </pattern>
    <!-- each arm fades from its outer edge (opaque) to the centre's edge (clear) -->
    <linearGradient id="fadeL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fadeR" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fadeT" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fadeB" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <mask id="arms" maskUnits="userSpaceOnUse" x="0" y="0" width="1920" height="1920">
      <rect x="0" y="0" width="420" height="1920" fill="url(#fadeL)"/>
      <rect x="1500" y="0" width="420" height="1920" fill="url(#fadeR)"/>
      <rect x="0" y="0" width="1920" height="420" fill="url(#fadeT)"/>
      <rect x="0" y="1500" width="1920" height="420" fill="url(#fadeB)"/>
    </mask>
  </defs>

  <!-- base colour; the central 1080x1080 shows only this -->
  <rect width="1920" height="1920" fill="#2a4470"/>

  <!-- everything in this group is confined to the arms by the mask -->
  <g mask="url(#arms)">
    <rect width="1920" height="1920" fill="#3a5c94"/>
    <rect width="1920" height="1920" fill="url(#grid)" opacity="0.5"/>
    <!-- one soft shape per arm: replace with the game's own motifs -->
    <g fill="#6f9fd8" fill-opacity="0.35">
      <circle cx="210" cy="960" r="120"/>
      <circle cx="1710" cy="960" r="120"/>
      <circle cx="960" cy="210" r="120"/>
      <circle cx="960" cy="1710" r="120"/>
    </g>
  </g>
</svg>
