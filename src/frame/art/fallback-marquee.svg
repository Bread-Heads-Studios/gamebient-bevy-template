<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1080" height="360" viewBox="0 0 1080 360">
  <!-- Shared ColecoVision GX fallback marquee, 3:1. The ColecoVision GX logo
       sits at the left (x 32 to 447, centred on row 154). The frame draws
       the game's title at run time in the box x 475 to 1052, centred on row
       154, and the score line in rows 288 to 360, so there is no <text>
       here (rsvg-convert swaps fonts silently) and rows 288 to 360 are one
       plain colour. The plate is black because the logo art is on black. -->
  <rect width="1080" height="288" fill="#000000"/>
  <rect y="0" width="1080" height="3" fill="#ff2b2b"/>
  <rect y="3" width="1080" height="3" fill="#ff7a00"/>
  <rect y="6" width="1080" height="3" fill="#ffd400"/>
  <rect y="9" width="1080" height="3" fill="#33cc33"/>
  <rect y="12" width="1080" height="3" fill="#00a4c7"/>
  <rect y="15" width="1080" height="3" fill="#8b5cf6"/>
  <rect y="18" width="1080" height="3" fill="#c026d3"/>
  <image x="32" y="66" width="415" height="176" preserveAspectRatio="xMidYMid meet"
         href="colecovision-gx-logo.png" xlink:href="colecovision-gx-logo.png"/>
  <rect x="461" y="66" width="2" height="176" fill="#aab3c0" fill-opacity="0.35"/>
  <!-- the score line's strip: rows 288 to 360 -->
  <rect y="288" width="1080" height="72" fill="#05070f"/>
</svg>
