name: CI

# Docs-only changes don't run CI (docs/build-and-release.md stays in: the
# Stale-size lint reads it). `paths` rather than `paths-ignore` so that one
# file can be re-included; later patterns override earlier ones.
on:
  push:
    branches: [main]
    paths: ['**', '!docs/**', 'docs/build-and-release.md']
  pull_request:
    paths: ['**', '!docs/**', 'docs/build-and-release.md']

# Cancel superseded runs on the same ref to save runner minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt · clippy · test
    # A push to main that lands a PR already ran this job on the PR, so skip
    # it: merge commits start "Merge pull request #", squash commits end
    # "(#N)". A skipped job bills no runner minutes. Direct pushes still run.
    if: >-
      github.event_name != 'push' ||
      !(startsWith(github.event.head_commit.message, 'Merge pull request #') ||
        contains(github.event.head_commit.message, ' (#'))
    runs-on: ubuntu-latest
    # Cap a hung job; GitHub's default is 6 h of billed minutes.
    timeout-minutes: 45
    # Strict gate: deny plain rustc warnings here too (unused imports, etc.).
    # Scoped to this job; the wasm bundle is built (warning-tolerant) by
    # deploy.yml on pushes to main, which runs the replay gate in build_web.sh.
    env:
      RUSTFLAGS: -D warnings
      # Debug info, not code, is what fills a runner's disk here. Five Bevy
      # test binaries (lib, playtest, selftest, archetype_order,
      # windowed_shape) carry it twice over — once in the rlib graph, once
      # per binary — and the failure it produces is not an out-of-disk
      # message but
      #   collect2: fatal error: ld terminated with signal 7 [Bus error]
      # in the middle of rust-lld, with the linker politely asking for an
      # llvm-project bug report. Measured on Dough.io: the
      # --all-targets --all-features target dir is 12 GB with debug info and
      # 2.0 GB without, test binaries 140 MB against 50 MB, and the suite
      # passes identically. Set here rather than in Cargo.toml so local
      # debugging keeps its symbols.
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4

      # Bevy's native build links against ALSA, libudev and the Linux
      # windowing stack (wayland/x11 features are enabled for non-wasm targets).
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --all-targets --all-features

      - name: Cutter tests
        working-directory: tools
        run: python3 -m unittest test_cut_clips -v

      - name: Entitlement middleware tests
        run: node --test tools/test_entitlement.mjs

      - name: Game size tests
        run: tools/test_game_size.sh

      - name: Stale-size lint
        run: tools/test_aspect_docs.sh

  rollout:
    name: rollout-replay.sh
    # A push to main that lands a PR already ran this job on the PR, so skip
    # it: merge commits start "Merge pull request #", squash commits end
    # "(#N)". A skipped job bills no runner minutes. Direct pushes still run.
    if: >-
      github.event_name != 'push' ||
      !(startsWith(github.event.head_commit.message, 'Merge pull request #') ||
        contains(github.event.head_commit.message, ' (#'))
    runs-on: ubuntu-latest
    # Cap a hung job; GitHub's default is 6 h of billed minutes.
    timeout-minutes: 45
    steps:
      # The rollout script and its test suite drive git history (they classify
      # a game's copy of a file against every committed template version), so
      # the shallow default checkout is not enough.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          key: rollout

      - name: shellcheck
        run: shellcheck tools/*.sh build_web.sh install.sh

      # --no-game skips part (b), the only part that needs a sibling
      # games/cannonball-putt checkout — a separate private repo this
      # workflow has no token for. Parts (a) and (c)-(h) all run, and that
      # includes both silent failures the wave-1 rollouts exposed: (g)
      # covers the missing LeaderboardScore impl AND the build_web.sh
      # verify.zip step that shipped games whose verify_url 404s. Part (b)
      # is still the only end-to-end "an unported game compiles after the
      # rollout" coverage, so run the suite WITHOUT the flag locally before
      # changing the script.
      - name: Rollout script test suite (no sibling game checkout)
        run: bash tools/test_rollout_replay.sh --no-game
