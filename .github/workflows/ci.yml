name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save runner minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt · clippy · test
    runs-on: ubuntu-latest
    # Strict gate: deny plain rustc warnings here too (unused imports, etc.).
    # Scoped to this job so it doesn't also fail the deploy-bundle build, which
    # mirrors the warning-tolerant Vercel build.
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4

      # Bevy's native build links against ALSA, libudev and the Linux
      # windowing stack (wayland/x11 features are enabled for non-wasm targets).
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --all-targets --all-features

      - name: Cutter tests
        working-directory: tools
        run: python3 -m unittest test_cut_clips -v

  rollout:
    name: rollout-replay.sh
    runs-on: ubuntu-latest
    steps:
      # The rollout script and its test suite drive git history (they classify
      # a game's copy of a file against every committed template version), so
      # the shallow default checkout is not enough.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          key: rollout

      - name: shellcheck
        run: shellcheck tools/*.sh build_web.sh install.sh

      # --no-game skips part (b), the only part that needs a sibling
      # games/cannonball-putt checkout — a separate private repo this
      # workflow has no token for. Parts (a) and (c)-(h) all run, and that
      # includes both silent failures the wave-1 rollouts exposed: (g)
      # covers the missing LeaderboardScore impl AND the build_web.sh
      # verify.zip step that shipped games whose verify_url 404s. Part (b)
      # is still the only end-to-end "an unported game compiles after the
      # rollout" coverage, so run the suite WITHOUT the flag locally before
      # changing the script.
      - name: Rollout script test suite (no sibling game checkout)
        run: bash tools/test_rollout_replay.sh --no-game

  build-web:
    name: build wasm bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          # Separate cache key from the native `check` job — different target,
          # different artifacts.
          key: wasm

      # Pinned to the wasm-bindgen *library* version in Cargo.lock. A CLI/lib
      # version skew produces a bundle that fails to load at runtime, so this
      # must be bumped in lockstep with the dependency.
      - name: Install wasm-bindgen-cli
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@0.2.108

      - name: Install binaryen (wasm-opt)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends binaryen

      # build_web.sh: cargo build (wasm-release) → wasm-bindgen → wasm-opt -Oz
      # → replay verifier (tools/build_verify.sh, -> dist/verify.zip) → brotli.
      # node is preinstalled on ubuntu-latest for the brotli step.
      - name: Build web bundle
        run: bash build_web.sh

      # The wasm-bindgen nodejs module require()s an ESM snippet, which needs
      # Node >= 20.19 / >= 22.12. ubuntu-latest's preinstalled node is older
      # than that on some runner images, so pin it explicitly.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The gate. tests/fixtures/selftest-wasm.gxr was RECORDED by this same
      # wasm module (node tools/verify_fixture.mjs --record ...), so both
      # sides of the comparison are wasm arithmetic — which is what actually
      # ships (wasm-in-browser records, wasm-in-Node verifies) and is
      # spec-deterministic. A failure here is a real determinism regression.
      - name: Verify the wasm-recorded fixture under Node
        run: node tools/verify_fixture.mjs tests/fixtures/selftest-wasm.gxr

      # Informational only. tests/fixtures/selftest.gxr was recorded by the
      # NATIVE build, so this step compares native arithmetic against wasm.
      # They agree for a sim that sticks to add/sub/mul, but native libm and
      # wasm are not required to round sin/cos/powf identically, and an ulp
      # of drift snowballs over enough ticks — so for a game with
      # transcendentals this can go red without anything being wrong. See
      # docs/replay-verification.md, "Two fixtures, and which one is the gate".
      - name: Cross-check the native fixture under Node (informational)
        continue-on-error: true
        run: node tools/verify_fixture.mjs tests/fixtures/selftest.gxr

      - name: Upload web bundle
        uses: actions/upload-artifact@v4
        with:
          name: gamebient-game-web
          path: dist/
          retention-days: 14
