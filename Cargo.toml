[package]
name = "gamebient-game"
version = "0.1.0"
edition = "2024"
# `cargo run` / `cargo run --features verify` is ambiguous with two [[bin]]
# targets; name the game explicitly.
default-run = "gamebient-game"

[lib]
name = "gamebient_game"
path = "src/lib.rs"

[[bin]]
name = "gamebient-game"
path = "src/main.rs"

[[bin]]
name = "verify"
path = "src/bin/verify.rs"
required-features = ["verify"]

[features]
# Marks a build that captures the window (footage, cover shots): the Linux
# window stays the game's own size and the cabinet frame is off unless asked
# for. src/display.rs and src/frame/mod.rs read only this feature, so a game
# with another capture feature (`harness`, `showcase`) lists "capture" in it
# instead of editing those files. Dev-only; never enabled in shipping builds.
capture = []
# Self-playtest harness: scripted input + periodic screenshots
# (src/game/autopilot.rs). Dev-only; never enabled in shipping builds.
autopilot = ["capture"]
# Offline footage recorder layered on the autopilot tour: fixed 1/60 s clock,
# one screenshot per frame, events.jsonl (src/game/record/, tools/record.sh).
# Dev-only; never enabled in shipping builds.
record = ["autopilot"]
# Replay verifier entry point (src/bin/verify.rs): native CLI and the
# wasm-bindgen module the site runs under Node. See docs/replay-verification.md.
verify = ["dep:wasm-bindgen"]
# Demo bundle: the run ends at `game::demo::demo_reached` with a DEMO OVER
# card and a `demo_end` host event. build_web.sh builds it into dist/ and the
# full game into dist/full/. Never for native, Pi, verify, autopilot or record.
demo = []
# Editor build: answers the editor's tunables layer over the host protocol
# and runs scenario checks in the browser (src/game/tunables/protocol.rs,
# checks.rs). tools/build_editor.sh builds it. Never for shipping bundles.
editor = []

[dependencies]
# Curated Bevy feature set — drops bevy_gltf, bevy_animation, bevy_gizmos,
# bevy_scene, bevy_picking, morph, ktx2, custom_cursor, sysinfo_plugin and the
# platform-specific window backends (wayland/x11/gilrs/android). All confirmed
# unused via grep against src/. Platform-specific features get re-added below
# for native targets only, so they don't bloat the wasm build.
bevy = { version = "0.18", default-features = false, features = [
    "async_executor",
    "bevy_asset",
    "bevy_audio",
    "bevy_camera",
    "bevy_color",
    "bevy_core_pipeline",
    "bevy_image",
    "bevy_input_focus",
    "bevy_light",
    "bevy_log",
    "bevy_mesh",
    "bevy_mikktspace",
    "bevy_pbr",
    "bevy_post_process",
    "bevy_render",
    "bevy_shader",
    "bevy_sprite",
    "bevy_sprite_render",
    "bevy_state",
    "bevy_text",
    "bevy_ui",
    "bevy_ui_render",
    "bevy_window",
    "bevy_winit",
    "default_font",
    "multi_threaded",
    "png",
    "reflect_auto_register",
    "smaa_luts",
    "std",
    "tonemapping_luts",
    "vorbis",
    # wav: the synth palette (src/game/audio/synth.rs) bakes SFX as in-memory
    # WAVs; without this decoder the first sound played panics at runtime with
    # UnrecognizedFormat (compiles fine, so CI cannot catch it).
    "wav",
    "webgl2",
    # zstd_rust: required by bevy_pbr/core_pipeline/anti_alias which
    # unconditionally enable bevy_image/zstd. Pure-Rust backend keeps the
    # wasm build self-contained (zstd_c needs a C toolchain).
    "zstd_rust",
] }
rand = "0.9"
# Sim RNG: Xoshiro256++ explicitly, never SmallRng (which picks a different
# algorithm on wasm32 and would break native-vs-wasm replay determinism).
rand_xoshiro = "0.7"
# The Gamebient control canon + web glue (host protocol, touch overlay,
# Gamepad API, legacy keyEvent bridge). Pin a tag; bump deliberately.
gamebient-input = { git = "https://github.com/Bread-Heads-Studios/gamebient-input", rev = "4d2038bdc96e900372aab15b45378b5c081b62e6" }
# Both already in Cargo.lock through Bevy (no new download, no new bundle
# code until used): the tunables host layer encodes its messages with them.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Look Pack content hash (src/look/validate.rs). Already in Cargo.lock
# through Bevy's asset processor, so no new download.
blake3 = "1"

# Native-only Bevy features: linux window backends and gilrs gamepad support.
# Excluded from the wasm build so they don't add dead code paths.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
bevy = { version = "0.18", features = ["bevy_gilrs", "wayland", "x11"] }

# getrandom 0.3+ requires both the wasm_js feature AND the cfg flag
# (.cargo/config.toml sets --cfg getrandom_backend="wasm_js")
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }
# Reads `?mute=1` from the page URL (game::host::LocalMute). Already in the
# lockfile through Bevy's web backend.
web-sys = { version = "0.3", features = ["Location", "Window"] }
# Pinned EXACTLY (`=`), not as a caret range: install.sh and both workflows
# install wasm-bindgen-cli@0.2.108, and a CLI/lib skew produces a bundle that
# fails to load at runtime with nothing in CI to catch it. A `cargo update`
# that walks the library forward must fail to resolve, not succeed quietly.
wasm-bindgen = { version = "=0.2.108", optional = true }

[dev-dependencies]
# Reads the embedded TTFs in `ui::fonts::tests` to hold each face's declared
# `advance_em` to the real glyph advances. Already in the lockfile through
# Bevy's text stack; pinned to that version so it adds nothing.
ttf-parser = "=0.25.1"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = true
codegen-units = 1
strip = true

[profile.wasm-release]
inherits = "release"
opt-level = "s"

# The editor's bundle (tools/build_editor.sh) is rebuilt after every change
# the agent makes, so it is tuned for relink time, not size: no LTO, parallel
# codegen, the game crate at opt-level 1 and incremental, dependencies
# compiled once for size. Symbols are stripped (the wasm name section alone
# was 41 MB). Measured on the template: 0.9 s to rebuild after an edit and a
# 44 MB wasm, against 127 s and 27 MB with wasm-release. Publishing still
# uses wasm-release.
[profile.wasm-editor]
inherits = "dev"
debug = false
strip = "symbols"
panic = "abort"

[profile.wasm-editor.package."*"]
opt-level = "s"
